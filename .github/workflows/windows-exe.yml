name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0e4d2-aimxity]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - '.github/workflows/windows-exe.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Aimxity-Windows-Installer
          path: release/Aimxity-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
